[project]
name = "job-search-agent-harness"
version = "1.1.1"
description = "A job-search harness for Claude Code and Codex that checks every claim against evidence."
requires-python = ">=3.10"
dependencies = [
    "PyYAML==6.0.3",
    "openpyxl==3.1.5",
    "pypdf==6.14.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

# `harness/` and `tools/` are import roots, not packages: their modules import
# each other by bare name and are also run directly as scripts, where Python
# already puts the script's directory on sys.path. Declaring the roots once
# here replaces the sys.path.insert line each module used to carry.
[tool.pytest.ini_options]
pythonpath = ["harness", "tools", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pinned so a local ruff and CI agree. Broader sets are a later decision, not a
# hidden default: without this, a global ruff config silently changes the result.
select = ["E4", "E7", "E9", "F", "I", "RUF100"]

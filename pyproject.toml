[project]
name = "job-search-agent-harness"
version = "1.1.1"
description = "A job-search harness for Claude Code and Codex that checks every claim against evidence."
requires-python = ">=3.10"
dependencies = [
    "PyYAML==6.0.3",
    "openpyxl==3.1.5",
    "pypdf==6.14.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
